<div class="container my-5">
  <div class="row">
    <!-- Formulario -->
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm border-0 p-3">
        <h5 class="mb-3">{{ editMode() ? 'Editar Producto' : 'Registrar Producto' }}</h5>
        <form (ngSubmit)="saveProduct()">
          <div class="mb-3">
            <label class="form-label">Nombre del Producto</label>
            <input type="text" class="form-control" [(ngModel)]="product().name" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Precio ($)</label>
            <input type="number" class="form-control" [(ngModel)]="product().price" name="price" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            {{ editMode() ? 'Guardar Cambios' : 'Añadir al Inventario' }}
          </button>
          <button *ngIf="editMode()" type="button" class="btn btn-secondary w-100 mt-2" (click)="resetForm()">
            Cancelar
          </button>
        </form>
      </div>
    </div>

    <!-- Tabla -->
    <div class="col-md-8">
      <div class="card shadow-sm border-0 p-3">
        <h5 class="mb-3">Inventario TechStock</h5>
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Producto</th>
              <th>Precio</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of products()">
              <td class="text-muted">#{{ item.id }}</td>
              <td class="fw-bold text-primary">{{ item.name }}</td>
              <td>${{ item.price }} USD</td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-warning me-2" (click)="editProduct(item)">Editar</button>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteProduct(item.id)">Eliminar</button>
              </td>
            </tr>
            <tr *ngIf="products().length === 0">
              <td colspan="4" class="text-center text-muted py-4">No hay datos en el inventario.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
